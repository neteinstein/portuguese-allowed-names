name: Deploy Web

# Builds the wasmJs (Compose Multiplatform for Web) distribution and publishes it to GitHub
# Pages and Cloudflare Pages. Both hosts are deployed from the same build while the site
# transitions from GitHub Pages to Cloudflare; once the custom domain points at Cloudflare,
# the GitHub Pages job (and its permissions/artifact) can be removed. Kept entirely separate from release.yml (Android/Play Store): different trigger,
# different job, no shared state - a broken web build can never block an Android release.
#
# Only deploys on push to `main` - the live Pages site should always reflect the last stable,
# merged state, never in-progress work on the migration branch. Use workflow_dispatch to build
# and deploy on demand (e.g. to preview the migration branch) without changing that.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build wasmJs distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build wasmJs production distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Report artifact size
        # Kotlin/Wasm + Compose Multiplatform Web binaries are multi-MB (see MIGRATION_PLAN.md
        # risk R6) - surfaced on every run so growth is visible instead of silently creeping up.
        # Gzipped as well as raw, because Pages serves gzip and that is what a visitor waits for;
        # pr-checks.yml enforces a budget on that number.
        run: |
          DIST=webApp/build/dist/wasmJs/productionExecutable
          du -sh "$DIST"
          TOTAL=0
          for FILE in $(find "$DIST" -type f ! -name '*.map'); do
            TOTAL=$((TOTAL + $(gzip -c "$FILE" | wc -c)))
          done
          echo "Gzipped download size: $((TOTAL / 1024)) KB"

      # actions/upload-pages-artifact and actions/deploy-pages below are pinned by version tag,
      # not commit SHA like this repo's other third-party actions - GitHub scope for this
      # session didn't cover resolving their SHAs. Fine to re-pin by SHA in a follow-up (e.g.
      # once Dependabot proposes it) to match convention.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

      # upload-pages-artifact produces a tarball only deploy-pages understands, so the same
      # files are also uploaded as a plain artifact for the Cloudflare job.
      - name: Upload distribution for Cloudflare Pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: webApp/build/dist/wasmJs/productionExecutable
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires the repo owner to have set Settings -> Pages -> Source to "GitHub Actions"
      # once (see MIGRATION_PLAN.md section 7) - this step fails until that one-time change is
      # made, independent of anything this workflow does.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    # Depends only on build, never on the GitHub Pages job: a failure on either host must not
    # stop the other from getting the new build during the transition.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    env:
      # Repo secrets CLOUDFLARE_API_TOKEN (token with "Cloudflare Pages: Edit" permission) and
      # CLOUDFLARE_ACCOUNT_ID. The Pages project must exist as a Direct Upload project; its name
      # defaults to portuguese-allowed-names and can be overridden with the repo variable
      # CLOUDFLARE_PAGES_PROJECT.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'portuguese-allowed-names' }}
    steps:
      # Skips (with a warning) instead of failing until the secrets are configured, so the
      # workflow stays green for GitHub Pages in the meantime.
      - name: Check Cloudflare credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping Cloudflare Pages deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distribution
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: dist

      # --branch is the ref that was built: on main this is a production deploy; a
      # workflow_dispatch from another branch becomes a Cloudflare preview deployment instead.
      - name: Deploy to Cloudflare Pages
        id: deployment
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
