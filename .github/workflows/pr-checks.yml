name: PR Checks

on:
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and Unit Tests run as two legs of the same matrix job so they execute in parallel, and
  # so that "fail-fast" (on by default, kept explicit here for clarity) cancels the other leg the
  # moment either one fails, instead of burning CI minutes on a PR that's already broken.
  checks:
    name: Android - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Lint Code
            gradle-task: lintDebug
          - name: Unit Tests
            gradle-task: testDebugUnitTest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run ${{ matrix.name }}
        run: ./gradlew ${{ matrix.gradle-task }}
        
      - name: Upload lint results
        if: always() && matrix.name == 'Lint Code'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-results
          path: androidApp/build/reports/lint-results-debug.html
          
      - name: Upload unit test results
        if: always() && matrix.name == 'Unit Tests'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-results
          path: androidApp/build/test-results/testDebugUnitTest/
          
      - name: Upload unit test reports
        if: always() && matrix.name == 'Unit Tests'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-reports
          path: androidApp/build/reports/tests/testDebugUnitTest/
  
  instrumented-tests:
    name: Android - Instrumented Tests
    # ubuntu-latest (with KVM) rather than macos-latest: GitHub's macOS runners are now
    # Apple Silicon (ARM64) and cannot boot the x86_64 emulator image, which fails every run
    # with "device not found". Linux hardware-accelerated emulators are also the officially
    # recommended, faster, cheaper option — see
    # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
    runs-on: ubuntu-latest
    needs: checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          # Without an explicit -gpu mode the emulator can fall back to an unreliable
          # auto-detected hardware GPU path on these headless runners (no real display),
          # intermittently failing to ever render a frame - the app then never leaves what
          # SplashSmokeTest sees as "not displayed", even though it's not stuck or crashed.
          # swiftshader_indirect is software rendering, so it's deterministic here regardless
          # of the runner's actual GPU availability. disable-animations avoids a similar class
          # of UI-timing flakiness from system animations mid-test.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest
          
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumented-test-results
          path: androidApp/build/outputs/androidTest-results/
          
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumented-test-reports
          path: androidApp/build/reports/androidTests/
  
  # The web and iOS targets get their own jobs rather than riding along with the Android matrix:
  # they need different runners (Chrome for wasmJs, macOS/Xcode for Kotlin/Native), and a broken
  # web or iOS build should be visible as such rather than as "the Android job failed".
  web:
    name: Web (wasmJs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The wasmJs tests run in a real headless Chrome (Karma). ubuntu-latest ships one; Karma
      # finds it through CHROME_BIN.
      - name: Run wasmJs tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew wasmJsTest

      # Builds the same production distribution deploy-web.yml publishes, so a broken web build
      # fails here instead of after merge.
      - name: Build wasmJs production distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Report artifact size
        run: du -sh webApp/build/dist/wasmJs/productionExecutable

      - name: Upload wasmJs test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasmjs-test-results
          path: '**/build/test-results/wasmJsBrowserTest/'

  ios:
    name: iOS
    # macOS runner: Kotlin/Native needs Xcode's toolchain to compile and link, and the shared
    # tests run on a simulator.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test

      # Linking, not just compiling: an iOS app shell imports this framework, and linking is what
      # proves every `actual` in the graph is really there. There is no Xcode project in this
      # repo yet (MIGRATION_PLAN.md), so this is the strongest iOS check available.
      - name: Link the shared iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-results
          path: '**/build/test-results/iosSimulatorArm64Test/'

  build:
    name: Android - Build APK
    runs-on: ubuntu-latest
    needs: checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
