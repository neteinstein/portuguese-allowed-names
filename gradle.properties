# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 4 GB rather than the 2 GB template default: linking a Kotlin/Wasm test binary needs noticeably
# more heap than JVM compilation, and at 2 GB the compiler dies with an OutOfMemoryError while
# building the feature modules' wasmJs test executables (which then shows up as a confusing
# "Back-end: Please report this problem" in whichever module happened to be next). GitHub's
# standard runners have 16 GB, so this is comfortably within CI's budget too.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Kotlin compilation runs in its *own* daemon, with its own heap that org.gradle.jvmargs above
# does not govern - so this has to be set separately, and the difference is not academic:
# compiling the feature modules' wasmJs test executables ran out of memory in the Kotlin daemon
# on CI while passing locally, because what the Kotlin daemon inherits when this is unset varies
# by environment. Setting it explicitly makes the two behave the same everywhere.
#
# 6 GB rather than the 4 GB that proves sufficient locally: the margin is deliberate, because a
# too-small value here costs a full red CI run (~8 minutes) to discover, while the runners have
# plenty to spare - 16 GB on GitHub's Linux images, 14 GB on the macOS ones the iOS job uses.
kotlin.daemon.jvmargs=-Xmx6144m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
